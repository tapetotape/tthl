<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="site-banner-top">
        <img src="{{ '/assets/banner.png' | relative_url }}" alt="Tape-to-Tape Hockey League banner" class="site-banner-img">
      </div>

      {% include nav.html %}

      <!-- Inline toggle fallback: ensures the hamburger works even if external nav.js doesn't load -->
      <script>
        (function() {
          try {
            var nav = document.querySelector('.site-nav');
            if (!nav) return;
            var toggle = nav.querySelector('.nav-toggle');
            if (!toggle) return;
            if (toggle._navInit) return; // already initialized by external script
            toggle._navInit = true;

            var toggleHandler = function(e) {
              try { e.preventDefault(); } catch (err) {}
              if (nav.classList.contains('open')) {
                nav.classList.remove('open');
                try { toggle.setAttribute('aria-expanded','false'); } catch (err) {}
              } else {
                nav.classList.add('open');
                try { toggle.setAttribute('aria-expanded','true'); } catch (err) {}
              }
            };

            if (window.PointerEvent) {
              toggle.addEventListener('pointerdown', toggleHandler);
            } else {
              toggle.addEventListener('touchstart', toggleHandler);
              toggle.addEventListener('click', toggleHandler);
            }

            // Close when clicking outside
            document.addEventListener('click', function(e) {
              if (!nav.classList.contains('open')) return;
              if (nav.contains(e.target)) return;
              nav.classList.remove('open');
              try { toggle.setAttribute('aria-expanded','false'); } catch (err) {}
            });

            // Close on Escape
            document.addEventListener('keydown', function(e) {
              if (e.key === 'Escape' && nav.classList.contains('open')) {
                nav.classList.remove('open');
                try { toggle.setAttribute('aria-expanded','false'); toggle.focus(); } catch (err) {}
              }
            });

            // Collapse after selecting a link on mobile
            var links = nav.querySelectorAll('a');
            for (var i = 0; i < links.length; i++) {
              links[i].addEventListener('click', function() {
                if (nav.classList.contains('open')) { nav.classList.remove('open'); try { toggle.setAttribute('aria-expanded','false'); } catch(e){} }
              });
            }

          } catch (err) {
            // silent fail — fallback shouldn't break the page
            console && console.error && console.error('nav fallback init error', err);
          }
        })();
      </script>
    </header>

    <main class="site-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <!-- optional footer content -->
    </footer>

    <script src="{{ '/assets/nav.js' | relative_url }}"></script>
  </body>
</html>
